<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Today's Strands Answer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="/shared/answers.css">
</head>
<body>
<header class="topbar">
  <a class="home-link" href="/strands/index.html">&larr; Strands</a>
  <h1>TODAY'S ANSWER</h1>
  <div id="authWidget" class="auth-widget"></div>
</header>
<main class="answers-main">
  <div id="answersRoot"></div>
</main>
<script src="/data/strands/puzzles.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="/shared/firebase-config.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/puzzle-loader.js"></script>
<script src="/shared/daily.js"></script>
<script src="/shared/answers.js"></script>
<script>
  window.PuzzleData.ready("strands").then(function () {
    window.AnswersPage.render({
      game: "strands",
      gameName: "Strands",
      playHref: "/strands/index.html",
      archiveHref: "/strands/answers/",
      onlyToday: true,
      getAnswerForDay: function (day) {
        const idx = window.DailyPuzzle.indexForDay(day, window.STRANDS_DATA.length);
        const p = window.STRANDS_DATA[idx];
        return "<strong>" + p.theme + "</strong> &mdash; spangram <span class=\"mono-answer\">" + p.spangram + "</span>. Words: " + p.words.join(", ");
      }
    });
  });
</script>
</body>
</html>
