<!DOCTYPE html>
<html lang="en">
<head>

<title>Puzzle Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>

  <h1>PUZZLE HUB</h1>
</header>

      <div class="icon">🟩</div>

    <a class="game-card" href="strands/index.html">
      <div class="icon">🔤</div>
      <h2>Strands</h2>

    <a class="game-card" href="crossword/index.html">
      <div class="icon">📰</div>

  </div>

</html>
