<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connections</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="home-link" href="../index.html">&larr; Hub</a>
  <h1>CONNECTIONS</h1>
  <div id="authWidget" class="auth-widget"></div>
  <button id="newPuzzleBtn" class="primary" style="padding:6px 12px;font-size:12px;">New puzzle</button>
</header>
<main>
  <p class="conn-instructions">Find groups of four related words.</p>
  <div id="solvedGroups" class="solved-groups"></div>
  <div id="grid" class="conn-grid"></div>
  <div class="conn-lives">Mistakes remaining: <span id="livesLeft">&#9679;&#9679;&#9679;&#9679;</span></div>
  <div class="conn-buttons">
    <button id="shuffleBtn" class="primary">Shuffle</button>
    <button id="deselectBtn" class="primary">Deselect all</button>
    <button id="submitBtn" class="primary">Submit</button>
  </div>
</main>
<div id="toast" class="message-toast"></div>
<script src="../data/connections/puzzles/dog-breeds.js"></script>
<script src="../data/connections/puzzles/kitchen.js"></script>
<script src="../data/connections/puzzles/weather.js"></script>
<script src="../data/connections/puzzles/music.js"></script>
<script src="../data/connections/puzzles/sports.js"></script>
<script src="../data/connections/puzzles/space.js"></script>
<script src="../data/connections/puzzles/garden.js"></script>
<script src="../data/connections/puzzles/office.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/puzzle-loader.js"></script>
<script src="script.js"></script>
</body>
</html>
