<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle Answers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="/shared/answers.css">
</head>
<body>
<header class="topbar">
  <a class="home-link" href="/wordle/index.html">&larr; Wordle</a>
  <h1>WORDLE ANSWERS</h1>
  <div id="authWidget" class="auth-widget"></div>
</header>
<main class="answers-main">
  <div id="answersRoot"></div>
</main>
<script src="/data/wordle/answers/answers-1-A-F.js"></script>
<script src="/data/wordle/answers/answers-2-G-M.js"></script>
<script src="/data/wordle/answers/answers-3-N-S.js"></script>
<script src="/data/wordle/answers/answers-4-T-Z.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="/shared/firebase-config.js"></script>
<script src="/shared/auth.js"></script>
<script src="/shared/puzzle-loader.js"></script>
<script src="/shared/daily.js"></script>
<script src="/shared/answers.js"></script>
<script>
  window.PuzzleData.ready("wordle").then(function () {
    window.AnswersPage.render({
      game: "wordle",
      gameName: "Wordle",
      playHref: "/wordle/index.html",
      getAnswerForDay: function (day) {
        const idx = window.DailyPuzzle.indexForDay(day, window.WORDLE_ANSWERS.length);
        return '<span class="mono-answer">' + window.WORDLE_ANSWERS[idx] + '</span>';
      }
    });
  });
</script>
</body>
</html>
